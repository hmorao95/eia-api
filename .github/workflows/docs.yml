name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Allow access to wrapkit (private repository)
        env:
          WRAPKIT_TOKEN: ${{ secrets.WRAPKIT_TOKEN }}
        run: git config --global url."https://x-access-token:${WRAPKIT_TOKEN}@github.com/hmorao95/wrapkit".insteadOf "https://github.com/hmorao95/wrapkit"

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build docs (warnings are errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    # Publish only on pushes to main; pull requests just build (to catch breakage).
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
