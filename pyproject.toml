[project]
name = "eia-api"
version = "0.1.0"
description = "Python wrapper for the U.S. Energy Information Administration (EIA) API v2 (electricity, petroleum, natural gas, coal, renewables)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hugo Morão", email = "hfmorao@gmail.com" }]
keywords = ["eia", "energy", "api", "electricity", "petroleum", "natural-gas"]
dependencies = [
    "pandas>=2.2",
    "requests>=2.28",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "fire>=0.6",
    "pyarrow>=15.0",
]

[project.urls]
Homepage = "https://github.com/hmorao95/eia-api"
Repository = "https://github.com/hmorao95/eia-api"
"Data source" = "https://www.eia.gov/opendata/"

[project.scripts]
eia-api = "eia_api.core:main"

[dependency-groups]
dev = [
    "pre-commit>=3.6",
    "ruff>=0.4.8",
    "mypy>=1.8",
    "codespell>=2.2.6",
    "deptry>=0.16",
    "interrogate>=1.7",
    "coverage>=7.4",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-sugar>=1.0",
]
typing = [
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1",
    "types-requests>=2.32",
]

[tool.uv]
default-groups = ["dev", "typing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eia_api"]

# --------------------------------------------------------------------------- #
# deptry
# --------------------------------------------------------------------------- #
[tool.deptry.per_rule_ignores]
# openpyxl (Excel) and pyarrow (Parquet) are used at runtime by pandas, not
# imported directly.
DEP002 = ["openpyxl", "pyarrow"]

# --------------------------------------------------------------------------- #
# codespell
# --------------------------------------------------------------------------- #
[tool.codespell]
skip = "*.lock,.git,.venv,*.csv,*.xlsx"
# "unparseable" is an accepted spelling variant here, not a typo.
ignore-words-list = "unparseable"

# --------------------------------------------------------------------------- #
# interrogate (docstring coverage)
# --------------------------------------------------------------------------- #
[tool.interrogate]
verbose = 2
fail-under = 95
# Nested closures (e.g. async test doubles standing in for an async API) are
# implementation detail and need no docstrings of their own.
ignore-nested-functions = true

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
exclude = [
    ".github/*",
    ".pytest_cache",
]

[tool.ruff.lint]
preview = true
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # cognitive complexity
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "DOC",    # pydoclint (docstring Returns/Raises match the code)
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "ERA",    # flake8-eradicate
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FBT",    # boolean trap
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INT",    # flake8-gettext
    "ISC",    # implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "NPY",    # numPy-specific rules
    "PD",     # pandas-vet
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific lints
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TCH",    # flake8-type-checking
    "relative-imports", # ban relative imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "multi-line-summary-first-line",   # Multi-line docstring summary should start at the first line
    "import-outside-top-level",# `import` should be at the top-level of a file
    "boolean-type-hint-positional-argument", # Boolean-typed positional argument in function definition
    "boolean-default-value-positional-argument", # Boolean default positional argument in function definition
    "missing-trailing-comma", # conflict with using ruff-format
    "single-line-implicit-string-concatenation", # conflict with using ruff-format
    "too-many-arguments",# many arguments: the data query genuinely has many filters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "unused-function-argument", # Unused function argument
    "assert",   # Use of `assert` detected
    "private-member-access", # Private member accessed
    "magic-value-comparison",# Magic value used in comparison
    "line-too-long",   # long lines in the fixture rows are readable as-is
    "too-many-return-statements", # the fake-API fixture dispatches on endpoint
    "unused-async",   # async test doubles mirror an async API without awaiting
    "DOC",    # pydoclint: don't burden test helpers/fixtures with it
]

[tool.ruff.lint.pylint]
# The CLI facade methods mirror the get_data flags plus a path/out argument.
max-args = 11
max-positional-args = 11

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
files = ["src", "tests"]
# Target the interpreter mypy runs under (3.10 on CI via the lock, newer
# locally) rather than a hard 3.10 pin. A fixed 3.10 target makes mypy reject
# PEP 695 `type` syntax that recent numpy/pandas stubs use on Python 3.12+.
pretty = true
strict = true
show_error_context = true
ignore_missing_imports = true
mypy_path = "src"

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --force-sugar --cov=src --cov-report=term-missing"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
parallel = true
source = ["eia_api"]
